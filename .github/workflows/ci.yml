name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Weekly: catches drift in distro images and tooling when nothing was pushed.
    - cron: '17 4 * * 1'

# Nothing gets a token by default; each job asks for what it needs.
permissions: {}

concurrency:
  # One run per event type and branch; a newer push cancels the older run.
  group: ci-${{ github.event_name }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

# Pull requests from branches in this repository are already covered by their
# push event, so every job carries the same condition: run the pull_request event
# only for forks.

jobs:
  lint:
    name: Lint
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install ShellCheck and shfmt (pinned, hash-verified)
        run: |
          python3 -m venv "$RUNNER_TEMP/lint"
          "$RUNNER_TEMP/lint/bin/pip" install --quiet --require-hashes -r .github/requirements-lint.txt
          echo "$RUNNER_TEMP/lint/bin" >> "$GITHUB_PATH"

      - name: Install actionlint (pinned, checksum-verified)
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          curl -fsSL -o "$RUNNER_TEMP/actionlint.tgz" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  $RUNNER_TEMP/actionlint.tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/actionlint.tgz" -C "$RUNNER_TEMP" actionlint
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Tool versions
        run: |
          shellcheck --version | sed -n '2p'
          shfmt --version
          actionlint -version | head -n 1

      - name: Bash syntax
        run: git ls-files '*.sh' | xargs -n1 bash -n

      - name: ShellCheck
        run: git ls-files '*.sh' | xargs shellcheck -x

      - name: shfmt
        run: git ls-files '*.sh' | xargs shfmt -d

      - name: actionlint
        run: actionlint

  test:
    name: Tests on the runner
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Unit and CLI tests (as an ordinary user)
        run: ./tests/run.sh

      - name: Unit and CLI tests (as root)
        run: sudo ./tests/run.sh

      - name: Full audit on this real systemd host
        run: |
          out="$RUNNER_TEMP/audit"
          mkdir "$out"
          set +e
          sudo ./vps-audit.sh -f both -o "$out" --no-network 2>&1 | tee "$out/audit.log"
          rc=${PIPESTATUS[0]}
          set -e
          echo "exit status: $rc"
          test "$rc" -le 2
          # The reports are root-owned (mode 600), so read them with sudo.
          sudo jq -e '.summary.total == (.checks | length) and .summary.total >= 40' "$out"/vps-audit-report-*.json
          if grep -E 'line [0-9]+: |command not found|syntax error|bad substitution|unbound variable|integer expression expected|unary operator expected' "$out/audit.log"; then
            echo "::error::Bash runtime error in audit output"
            exit 1
          fi

  plan:
    name: Plan distro matrix
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      images: ${{ steps.list.outputs.images }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: list
        # tests/matrix.sh is the single list of images; the workflow just reads it.
        run: echo "images=$(./tests/matrix.sh -l | awk '{print $1}' | jq -R . | jq -sc .)" >> "$GITHUB_OUTPUT"

  distros:
    name: ${{ matrix.image }}
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJSON(needs.plan.outputs.images) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run tests, scenarios and a full audit in ${{ matrix.image }}
        env:
          IMAGE: ${{ matrix.image }}
        run: ./tests/matrix.sh "$IMAGE"

      - name: Keep results for diagnosis
        if: ${{ failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: results-${{ strategy.job-index }}
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore

  ci-ok:
    name: CI OK
    # A single required check for branch protection.
    if: ${{ !cancelled() }}
    needs: [lint, test, plan, distros]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions: {}
    steps:
      - name: Every job succeeded (or was skipped as a duplicate)
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: echo "$NEEDS" | jq -e 'all(.[]; .result == "success" or .result == "skipped")'

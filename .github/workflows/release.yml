name: Release

# Publishing a version tag (vX.Y.Z) builds a GitHub Release containing the
# script, a SHA256SUMS file and a signed build-provenance attestation.
#
# Verify a downloaded release:
#   sha256sum -c SHA256SUMS
#   gh attestation verify vps-audit.sh --repo tomtom215/vps-audit
# Download the asset from the release page (releases/download/<tag>/vps-audit.sh),
# not from raw.githubusercontent.com: the attestation covers the release asset.

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']

permissions: {}

jobs:
  release:
    name: Release ${{ github.ref_name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write # create the release
      id-token: write # sign the attestation
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: The tag must match the script version and have a changelog entry
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          script_version="$(sed -n 's/^readonly VERSION="\(.*\)"$/\1/p' vps-audit.sh)"
          if [ "$version" != "$script_version" ]; then
            echo "::error::tag $TAG does not match VERSION=$script_version in vps-audit.sh"
            exit 1
          fi
          if ! grep -q "^## \[$version\]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no '## [$version]' section"
            exit 1
          fi
          awk -v v="$version" '$0 ~ "^## \\[" v "\\]" {on=1; next} /^## \[/ {on=0} on' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          test -s "$RUNNER_TEMP/notes.md"

      - name: Tests
        run: |
          ./tests/run.sh
          sudo ./tests/run.sh

      - name: Build release assets
        run: |
          mkdir dist
          cp vps-audit.sh dist/vps-audit.sh
          (cd dist && sha256sum vps-audit.sh > SHA256SUMS && cat SHA256SUMS)

      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/vps-audit.sh

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" dist/vps-audit.sh dist/SHA256SUMS \
            --verify-tag --title "$TAG" --notes-file "$RUNNER_TEMP/notes.md"
